<body>
  
  <div class="screen-viewport">
    <div class="screen-track">

    


    <div class="screen music-container">

      <input 
        type="text" 
        id="search-bar" 
        placeholder="Search songs..." 
        autocomplete="off">
        <ul id="playlist">
        <!-- Songs will be added here dynamically-->  
         <!-- we'll never know the truth of mashle-->
      </ul>
    </div>

<div class="screen playlists-screen" id="libraryScreen">

  <div class = "songRequestScreen" id="songRequest">
    <button class="closeRequest" id="closeRequest">
    ▼
  </button>

      <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLSfFAmJ36AErLUV0SLYX8BSZOm4j00yqk2k9Z661v-amwD2vsA/viewform?usp=dialogembedded=true"
      width="100%"
      height="100%"
      frameborder="0">
  </iframe>
</div>

  <div class = "topBarScreen" id = "topBar">
    <h1 class="screen-title">     Your Library</h1>
    
    <button class = "options" id = "optionsbtn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path d="M10 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm0-6a2 2 0 1 0 4 0 2 2 0 0 0-4 0zm0 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0z" fill="#ffffff"></path></g></svg>
    </button>

    <div class="optionsMenu" id="optionsMenu">
  <button class="optionItem" id="requestSongOption"></button>
</div> 
  </div>

  <div class="library-grid">
    <button class="library-btn" data-library="NoTemeréVol10">
      <img src="images/Screenshot 2026-05-16 12.04.27 PM.png">
      <span>No Temeré, Vol.10</span>
    </button>

    <button class="library-btn" data-library="NecesitoTuPresenciaVol7">
      <img src="images/Cover of Soy Peregrino by Anita Morán.jpg",>
      <span>Necesito Tu Presencia, Vol.7</span>
    </button>
  </div>
</div>

<div class="screen library-playlist-screen" id="libraryPlaylistScreen">

  <div class="library-big-controls">
    
    
    <img id="libraryPlaylistCover" class="library-playlist-cover" src="" alt="Playlist Cover">
    <!--<h1 class="screen-title" id="libraryTitle"></h1>-->


    <div class="library-big-buttons-row">
  <button id="libraryBigShuffle" class="library-big-btn-wow">

          </svg>

  <button id="libraryBigPlay" class="library-big-btn">

  </button>
</div>
</div>


  <ul id = "libraryPlaylist">
    <!-- Library playlist songs will appear here -->
  </ul>
</div>

</div>

  <div class="bottom-nav">
    <button id="open-playlist" class="mini-player">
    <img id="mini-cover" src="" alt="cover" />

    <div class="mini-text">
      <span id="mini-title">Song Title</span>
      <span id="mini-artist">Artist</span>
    </div>

    <div class="mini-controls">
      <!-- Play -->
      <svg id="mini-play" viewBox="0 0 24 24" aria-hidden="true"> 
        <path d="M8 5v14l11-7z"></path> 
      </svg>

    <!-- Pause -->
    <svg id="mini-pause" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
    </svg>
  </div>
  </button>

  <div class ="bottom-bar">
    <input type="range" id="bottom-seek-bar" value="0"> 
  </div>

<div class="nav-buttons">
  <button id="nav-all" class="nav-btn">

    <span>Your Library</span>
  </button>

  <button id="nav-playlist" class="nav-btn">

</div>

</div>

  <div id="currentPlaylistLabel">All Songs</div>

  <div class="player">

    <div class="player-content">


      <div class="now-playing">
        <div class = "cover-wrapper">
          <img id="cover" src="images/song1.jpg" alt="Cover Art">
        </div>
        <img id="video-cover" src="images/song1.jpg">   
        <div class="title-wrapper">
          <h2 id="title">Song Title</h2>
        </div>
        <p id="artist">Artist</p>
      </div>

      <audio id="audio"></audio>
      


      <input type="range" id="seek-bar" value="0" step="0.001">

        <span id="current-time">0:00</span>
        <span id="total-duration">- 0:00</span>
